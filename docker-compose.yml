services:
  mysql:
    image: mysql:8.0
    container_name: cloudtunes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cloudtunes
      MYSQL_USER: cloudtunes
      MYSQL_PASSWORD: cloudtunes
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucloudtunes", "-pcloudtunes"]
      interval: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: cloudtunes-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/cloudtunes &&
      mc anonymous set none local/cloudtunes &&
      echo 'bucket cloudtunes ready (private)'
      "

volumes:
  mysql-data:
  minio-data:
