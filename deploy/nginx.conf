server {
    listen 80;
    server_name _;

    # Built SPA: copy frontend/dist here with `npm run build` then scp/rsync.
    root /var/www/cloudtunes;
    index index.html;

    # Client-side routes must fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audio must start immediately and stream, not buffer through nginx.
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 200M;
        proxy_read_timeout 300s;
    }
}
